name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild on January 1 so the footer's copyright year stays current.
    - cron: "0 7 1 1 *"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_URL: ${{ secrets.S3_BUCKET_URL }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/bootstrap
      - run: pnpm build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload hashed assets
        run: >-
          aws s3 sync ./dist/_astro/ "$S3_BUCKET_URL/_astro/" --delete
          --cache-control "public, max-age=31536000, immutable"
      - name: Upload pages
        run: >-
          aws s3 sync ./dist/ "$S3_BUCKET_URL" --delete --exclude "_astro/*"
          --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidate CloudFront distribution
        run: >-
          AWS_MAX_ATTEMPTS=6 aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
